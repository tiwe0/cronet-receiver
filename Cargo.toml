[package]
name = "cronet-receiver"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
chrono = "0.4.43"
dashmap = "6.1.0"
fred =  { version = "10.1.0", features = ["i-all"] }
futures = "0.3.31"
