[package]
name = "cronet-receiver"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
arc-swap = "1.8.0"
bytes = "1.11.0"
chrono = "0.4.43"
dashmap = "6.1.0"
fred =  { version = "10.1.0", features = ["i-all"] }
futures = "0.3.31"
nanoid = "0.4.0"
notify-debouncer-mini = "0.7.0"
once_cell = "1.21.3"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
